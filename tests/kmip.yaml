name: okms-cli KMIP test suite
description: Test the OKMS KMIP subcommand
testcases:
  - name: Create keys
    steps:
      - name: Create an AES 256 key
        type: okms-cmd
        args: kmip create symmetric --alg AES --size 256 --usage encrypt,decrypt,wrapKey,unwrapKey
        assertions:
          - result.code ShouldEqual 0
        vars:
          aesKeyId:
            from: result.systemoutjson.UniqueIdentifier
      - name: Create an RSA 2048 key pair
        type: okms-cmd
        args: kmip create key-pair --alg RSA --size 2048 --public-usage verify,encrypt --private-usage sign,decrypt
        assertions:
          - result.code ShouldEqual 0
        vars:
          pubRsaKeyId:
            from: result.systemoutjson.PublicKeyUniqueIdentifier
          privRsaKeyId:
            from: result.systemoutjson.PrivateKeyUniqueIdentifier
      - name: Create an ECDSA P-256 key pair
        type: okms-cmd
        args: kmip create key-pair --alg ECDSA --curve P-256
        assertions:
          - result.code ShouldEqual 0
        vars:
          pubEcdsaKeyId:
            from: result.systemoutjson.PublicKeyUniqueIdentifier
          privEcdsaKeyId:
            from: result.systemoutjson.PrivateKeyUniqueIdentifier

  - name: Activate object
    steps:
      - name: Activate AES key
        type: okms-cmd
        args: kmip activate {{.Create-keys.aesKeyId}}
        assertions:
          - result.code ShouldEqual 0
      - name: Activate AES key again should fail
        type: okms-cmd
        args: kmip activate {{.Create-keys.aesKeyId}}
        assertions:
          - result.code ShouldEqual 1

  - name: Register then Get secrets
    steps:
      - name: Register plain secret
        type: okms-cmd
        args: kmip register secret "foo bar"
        assertions:
          - result.code ShouldEqual 0
        vars:
          secretId:
            from: result.systemoutjson.UniqueIdentifier
      - name: Get plain secret
        type: okms-cmd
        args: kmip get {{ .secretId }}
        format: text
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual "foo bar"
      - name: Register base64 secret
        type: okms-cmd
        args: kmip register secret --base64 {{ (b64enc "foo bar") }}
        assertions:
          - result.code ShouldEqual 0
        vars:
          secretId:
            from: result.systemoutjson.UniqueIdentifier
      - name: Get base64 secret
        type: okms-cmd
        args: kmip get {{ .secretId }}
        format: text
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual "foo bar"

  - name: Register then Get Symmetric key
    steps:
      - name: Register plain AES key
        type: okms-cmd
        args: kmip register symmetric --alg AES "aaaaaaaaaaaaaaaa"
        assertions:
          - result.code ShouldEqual 0
        vars:
          symId:
            from: result.systemoutjson.UniqueIdentifier
      - name: Get plain AES key
        type: okms-cmd
        args: kmip get {{ .symId }}
        format: text
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual "aaaaaaaaaaaaaaaa"
      - name: Register base64 AES key
        type: okms-cmd
        args: kmip register symmetric --base64 --alg AES {{(b64enc "aaaaaaaaaaaaaaaa")}}
        assertions:
          - result.code ShouldEqual 0
        vars:
          symId:
            from: result.systemoutjson.UniqueIdentifier
      - name: Get base64 AES key
        type: okms-cmd
        args: kmip get {{ .symId }}
        format: text
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual "aaaaaaaaaaaaaaaa"

  - name: Register PrivateKeys
    steps:
      - name: Register {{ .value.name }}
        type: okms-cmd
        args: kmip register private-key @{{ .value.file }}
        assertions:
          - result.code ShouldEqual 0
        range:
          - name: ECDSA PKCS8 private key
            file: testdata/ecdsa_pkcs8.priv.pem
          - name: ECDSA SEC1 private key
            file: testdata/ecdsa_sec1.priv.pem
          - name: RSA PKCS8 private key
            file: testdata/rsa_pkcs8.priv.pem
          - name: RSA PKCS1 private key
            file: testdata/rsa_pkcs1.priv.pem

  - name: Register PublicKeys
    steps:
      - name: Register {{ .value.name }}
        type: okms-cmd
        args: kmip register public-key @{{ .value.file }}
        assertions:
          - result.code ShouldEqual 0
        range:
          - name: ECDSA X509 public key
            file: testdata/ecdsa_x509.pub.pem
          - name: RSA X509 public key
            file: testdata/rsa_x509.pub.pem
          - name: ECDSA PKCS8 private key
            file: testdata/ecdsa_pkcs8.priv.pem
          - name: ECDSA SEC1 private key
            file: testdata/ecdsa_sec1.priv.pem
          - name: RSA PKCS8 private key
            file: testdata/rsa_pkcs8.priv.pem
          - name: RSA PKCS1 private key
            file: testdata/rsa_pkcs1.priv.pem

  - name: Register Key Pairs
    steps:
      - name: Register {{ .value.name }}
        type: okms-cmd
        args: kmip register key-pair @{{ .value.file }}
        assertions:
          - result.code ShouldEqual 0
        range:
          - name: ECDSA PKCS8 private key
            file: testdata/ecdsa_pkcs8.priv.pem
          - name: ECDSA SEC1 private key
            file: testdata/ecdsa_sec1.priv.pem
          - name: RSA PKCS8 private key
            file: testdata/rsa_pkcs8.priv.pem
          - name: RSA PKCS1 private key
            file: testdata/rsa_pkcs1.priv.pem

  - name: Register Certificate
    steps:
      - name: Register X509 certificate
        type: okms-cmd
        args: kmip register certificate @testdata/x509_cert.pem
        assertions:
          - result.code ShouldEqual 0

  - name: Locate kmip objects
    steps:
      - name: Locate without details
        type: okms-cmd
        args: kmip locate
        assertions:
          - result.code ShouldEqual 0
          - result.systemoutjson.UniqueIdentifier ShouldContain {{.Create-keys.aesKeyId}}
          - result.systemoutjson.UniqueIdentifier ShouldContain {{.Create-keys.pubRsaKeyId}}
          - result.systemoutjson.UniqueIdentifier ShouldContain {{.Create-keys.privRsaKeyId}}
          - result.systemoutjson.UniqueIdentifier ShouldContain {{.Create-keys.pubEcdsaKeyId}}
          - result.systemoutjson.UniqueIdentifier ShouldContain {{.Create-keys.privEcdsaKeyId}}

      - name: Locate with details
        type: okms-cmd
        args: kmip locate --details
        format: text
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring {{.Create-keys.aesKeyId}}
          - result.systemout ShouldContainSubstring {{.Create-keys.pubRsaKeyId}}
          - result.systemout ShouldContainSubstring {{.Create-keys.privRsaKeyId}}
          - result.systemout ShouldContainSubstring {{.Create-keys.pubEcdsaKeyId}}
          - result.systemout ShouldContainSubstring {{.Create-keys.privEcdsaKeyId}}

      - name: Locate by type
        type: okms-cmd
        args: kmip locate --type PrivateKey
        assertions:
          - result.code ShouldEqual 0
          - result.systemoutjson.UniqueIdentifier ShouldNotContain {{.Create-keys.aesKeyId}}
          - result.systemoutjson.UniqueIdentifier ShouldNotContain {{.Create-keys.pubRsaKeyId}}
          - result.systemoutjson.UniqueIdentifier ShouldContain {{.Create-keys.privRsaKeyId}}
          - result.systemoutjson.UniqueIdentifier ShouldNotContain {{.Create-keys.pubEcdsaKeyId}}
          - result.systemoutjson.UniqueIdentifier ShouldContain {{.Create-keys.privEcdsaKeyId}}

      - name: Locate by state
        type: okms-cmd
        args: kmip locate --state active
        assertions:
          - result.code ShouldEqual 0
          - result.systemoutjson.UniqueIdentifier ShouldContain {{.Create-keys.aesKeyId}}
          - result.systemoutjson.UniqueIdentifier ShouldNotContain {{.Create-keys.pubRsaKeyId}}
          - result.systemoutjson.UniqueIdentifier ShouldNotContain {{.Create-keys.privRsaKeyId}}
          - result.systemoutjson.UniqueIdentifier ShouldNotContain {{.Create-keys.pubEcdsaKeyId}}
          - result.systemoutjson.UniqueIdentifier ShouldNotContain {{.Create-keys.privEcdsaKeyId}}

  - name: Get attributes
    steps:
      - name: Get attributes of AES key
        type: okms-cmd
        args: kmip attributes get {{.Create-keys.aesKeyId}}
        format: text
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring {{.Create-keys.aesKeyId}}
          - result.systemout ShouldContainSubstring Active

  - name: List and add attributes
    steps:
      - name: List attributes of AES key
        type: okms-cmd
        args: kmip attributes list {{.Create-keys.aesKeyId}}
        assertions:
          - result.code ShouldEqual 0
          - result.systemoutjson.UniqueIdentifier ShouldEqual {{.Create-keys.aesKeyId}}
          - result.systemoutjson.AttributeName ShouldContain "Cryptographic Algorithm"
          - result.systemoutjson.AttributeName ShouldNotContain "Description"
      - name: List attributes of AES key as text
        type: okms-cmd
        args: kmip attr ls {{.Create-keys.aesKeyId}}
        format: text
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "Cryptographic Algorithm"
      - name: Add a description to AES key
        type: okms-cmd
        args: kmip attributes add {{.Create-keys.aesKeyId}} Description "okms-cli kmip tests"
        assertions:
          - result.code ShouldEqual 0
          - result.systemoutjson.UniqueIdentifier ShouldEqual {{.Create-keys.aesKeyId}}
          - result.systemoutjson.Attribute.AttributeName ShouldEqual Description
      - name: Added attribute is listed
        type: okms-cmd
        args: kmip attributes list {{.Create-keys.aesKeyId}}
        assertions:
          - result.code ShouldEqual 0
          - result.systemoutjson.AttributeName ShouldContain "Description"
      - name: Added attribute value is returned
        type: okms-cmd
        args: kmip attributes get {{.Create-keys.aesKeyId}}
        format: text
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "okms-cli kmip tests"
      - name: Adding an already set single instance attribute should fail
        type: okms-cmd
        args: kmip attributes add {{.Create-keys.aesKeyId}} Description "okms-cli kmip tests again"
        assertions:
          - result.code ShouldEqual 1

  - name: Obtain lease
    steps:
      - name: Obtain lease of AES key
        type: okms-cmd
        args: kmip obtain-lease {{.Create-keys.aesKeyId}}
        assertions:
          - result.code ShouldEqual 0
          - result.systemoutjson.UniqueIdentifier ShouldEqual {{.Create-keys.aesKeyId}}
          - result.systemoutjson ShouldContainKey LeaseTime
      - name: Obtain lease of AES key as text
        type: okms-cmd
        args: kmip lease {{.Create-keys.aesKeyId}}
        format: text
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "Lease time:"

  - name: Archive then Recover
    steps:
      - name: Create an AES 256 key to archive
        type: okms-cmd
        args: kmip create symmetric --alg AES --size 256
        assertions:
          - result.code ShouldEqual 0
        vars:
          archivedKeyId:
            from: result.systemoutjson.UniqueIdentifier
      - name: Archive key
        type: okms-cmd
        args: kmip archive {{.archivedKeyId}}
        assertions:
          - result.code ShouldEqual 0
          - result.systemoutjson.UniqueIdentifier ShouldEqual {{.archivedKeyId}}
      - name: Archive an archived key should fail
        type: okms-cmd
        args: kmip archive {{.archivedKeyId}}
        assertions:
          - result.code ShouldEqual 1
      - name: Get an archived key should fail
        type: okms-cmd
        args: kmip get {{.archivedKeyId}}
        assertions:
          - result.code ShouldEqual 1
      - name: Archived key is not located
        type: okms-cmd
        args: kmip locate
        assertions:
          - result.code ShouldEqual 0
          - result.systemoutjson.UniqueIdentifier ShouldNotContain {{.archivedKeyId}}
      - name: Recover key
        type: okms-cmd
        args: kmip recover {{.archivedKeyId}}
        format: text
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "Recovered object {{.archivedKeyId}}"
      - name: Get a recovered key
        type: okms-cmd
        args: kmip get {{.archivedKeyId}}
        assertions:
          - result.code ShouldEqual 0
          - result.systemoutjson.UniqueIdentifier ShouldEqual {{.archivedKeyId}}

  - name: Encrypt then Decrypt with AES
    steps:
      - name: Create an AES 256 encryption key
        type: okms-cmd
        args: kmip create symmetric --alg AES --size 256 --usage encrypt,decrypt
        assertions:
          - result.code ShouldEqual 0
        vars:
          keyId:
            from: result.systemoutjson.UniqueIdentifier
      - name: Encrypt with a PreActive key should fail
        type: okms-cmd
        args: kmip encrypt {{.keyId}} "okms-cli kmip tests" --mode GCM
        assertions:
          - result.code ShouldEqual 1
      - name: Activate AES encryption key
        type: okms-cmd
        args: kmip activate {{.keyId}}
        assertions:
          - result.code ShouldEqual 0
      - name: Encrypt with GCM
        type: okms-cmd
        args: kmip encrypt {{.keyId}} "okms-cli kmip tests" --mode GCM --aad "okms-cli context"
        assertions:
          - result.code ShouldEqual 0
          - result.systemoutjson.UniqueIdentifier ShouldEqual {{.keyId}}
          - result.systemoutjson.Data ShouldNotBeEmpty
          - result.systemoutjson.IVCounterNonce ShouldNotBeEmpty
          - result.systemoutjson.AuthenticatedEncryptionTag ShouldNotBeEmpty
        vars:
          gcmData:
            from: result.systemoutjson.Data
          gcmIv:
            from: result.systemoutjson.IVCounterNonce
          gcmTag:
            from: result.systemoutjson.AuthenticatedEncryptionTag
      - name: Decrypt with GCM
        type: okms-cmd
        args: kmip decrypt {{.keyId}} {{.gcmData}} --mode GCM --iv {{.gcmIv}} --tag {{.gcmTag}} --aad "okms-cli context"
        format: text
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual "okms-cli kmip tests"
      - name: Decrypt with GCM and another AAD should fail
        type: okms-cmd
        args: kmip decrypt {{.keyId}} {{.gcmData}} --mode GCM --iv {{.gcmIv}} --tag {{.gcmTag}} --aad "another context"
        assertions:
          - result.code ShouldEqual 1
      - name: Encrypt with CBC as text
        type: okms-cmd
        args: kmip encrypt {{.keyId}} "okms-cli kmip tests" --mode CBC --padding PKCS5
        format: text
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "Data:"
          - result.systemout ShouldContainSubstring "IV:"
      - name: Encrypt with CBC
        type: okms-cmd
        args: kmip encrypt {{.keyId}} "okms-cli kmip tests" --mode CBC --padding PKCS5
        assertions:
          - result.code ShouldEqual 0
          - result.systemoutjson.Data ShouldNotBeEmpty
          - result.systemoutjson.IVCounterNonce ShouldNotBeEmpty
        vars:
          cbcData:
            from: result.systemoutjson.Data
          cbcIv:
            from: result.systemoutjson.IVCounterNonce
      - name: Decrypt with CBC
        type: okms-cmd
        args: kmip decrypt {{.keyId}} {{.cbcData}} --mode CBC --padding PKCS5 --iv {{.cbcIv}}
        format: text
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual "okms-cli kmip tests"
      - name: Revoke AES encryption key
        type: okms-cmd
        args: kmip revoke --force {{.keyId}}
        assertions:
          - result.code ShouldEqual 0

  - name: Encrypt then Decrypt with RSA
    steps:
      - name: Create an RSA 2048 encryption key pair
        type: okms-cmd
        args: kmip create key-pair --alg RSA --size 2048 --public-usage encrypt --private-usage decrypt
        assertions:
          - result.code ShouldEqual 0
        vars:
          pubKeyId:
            from: result.systemoutjson.PublicKeyUniqueIdentifier
          privKeyId:
            from: result.systemoutjson.PrivateKeyUniqueIdentifier
      - name: Activate {{ .value }}
        type: okms-cmd
        range:
          - "{{.pubKeyId}}"
          - "{{.privKeyId}}"
        args: kmip activate {{ .value }}
        assertions:
          - result.code ShouldEqual 0
      - name: Encrypt with the public key and OAEP
        type: okms-cmd
        args: kmip encrypt {{.pubKeyId}} "okms-cli kmip tests" --padding OAEP --hash SHA256
        assertions:
          - result.code ShouldEqual 0
          - result.systemoutjson.Data ShouldNotBeEmpty
        vars:
          oaepData:
            from: result.systemoutjson.Data
      - name: Decrypt with the private key and OAEP
        type: okms-cmd
        args: kmip decrypt {{.privKeyId}} {{.oaepData}} --padding OAEP --hash SHA256
        format: text
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual "okms-cli kmip tests"
      - name: Revoke {{ .value }}
        type: okms-cmd
        range:
          - "{{.pubKeyId}}"
          - "{{.privKeyId}}"
        args: kmip revoke --force {{ .value }}
        assertions:
          - result.code ShouldEqual 0

  - name: Sign then Verify
    steps:
      - name: Sign with the ECDSA private key
        type: okms-cmd
        args: kmip sign {{.Create-keys.privEcdsaKeyId}} "okms-cli kmip tests" --alg ES256
        format: text
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldNotBeEmpty
        vars:
          ecdsaSignature:
            from: result.systemout
      - name: Verify with the ECDSA public key
        type: okms-cmd
        args: kmip verify {{.Create-keys.pubEcdsaKeyId}} "okms-cli kmip tests" {{.ecdsaSignature}} --alg ES256
        format: text
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual "Signature is valid"
      - name: Verify other data should fail
        type: okms-cmd
        args: kmip verify {{.Create-keys.pubEcdsaKeyId}} "okms-cli kmip tests tampered" {{.ecdsaSignature}} --alg ES256
        assertions:
          - result.code ShouldEqual 1
      - name: Digest the data
        script: printf '%s' "okms-cli kmip tests" | openssl dgst -sha256 -binary | base64
        assertions:
          - result.code ShouldEqual 0
        vars:
          digest:
            from: result.systemout
      - name: Sign a digest with the ECDSA private key
        type: okms-cmd
        args: kmip sign {{.Create-keys.privEcdsaKeyId}} {{.digest}} --alg ES256 --digested
        assertions:
          - result.code ShouldEqual 0
          - result.systemoutjson.SignatureData ShouldNotBeEmpty
        vars:
          digestSignature:
            from: result.systemoutjson.SignatureData
      - name: Verify the signature of the digest against the data
        type: okms-cmd
        args: kmip verify {{.Create-keys.pubEcdsaKeyId}} "okms-cli kmip tests" {{.digestSignature}} --alg ES256
        assertions:
          - result.code ShouldEqual 0
          - result.systemoutjson.ValidityIndicator ShouldEqual Valid
      - name: Sign with an algorithm not matching the key should fail
        type: okms-cmd
        args: kmip sign {{.Create-keys.privEcdsaKeyId}} "okms-cli kmip tests" --alg RS256
        assertions:
          - result.code ShouldEqual 1
      - name: Sign with the RSA private key using PKCS1 v1.5
        type: okms-cmd
        args: kmip sign {{.Create-keys.privRsaKeyId}} "okms-cli kmip tests" --alg RS256
        assertions:
          - result.code ShouldEqual 0
          - result.systemoutjson.SignatureData ShouldNotBeEmpty
        vars:
          rsaSignature:
            from: result.systemoutjson.SignatureData
      - name: Verify with the RSA public key using PKCS1 v1.5
        type: okms-cmd
        args: kmip verify {{.Create-keys.pubRsaKeyId}} "okms-cli kmip tests" {{.rsaSignature}} --alg RS256
        format: text
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual "Signature is valid"
      - name: Sign with the RSA private key using PSS
        type: okms-cmd
        args: kmip sign {{.Create-keys.privRsaKeyId}} "okms-cli kmip tests" --alg PS384
        format: text
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldNotBeEmpty
        vars:
          pssSignature:
            from: result.systemout
      - name: Verify with the RSA public key using PSS
        type: okms-cmd
        args: kmip verify {{.Create-keys.pubRsaKeyId}} "okms-cli kmip tests" {{.pssSignature}} --alg PS384
        format: text
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual "Signature is valid"

  - name: Get usage allocation
    steps:
      - name: Create an AES 256 key with usage limits
        type: okms-cmd
        args: kmip create symmetric --alg AES --size 256 --usage-limit 10 --usage-limit-unit Object
        assertions:
          - result.code ShouldEqual 0
        vars:
          keyId:
            from: result.systemoutjson.UniqueIdentifier
      - name: Usage limits are set
        type: okms-cmd
        args: kmip attributes list {{.keyId}}
        assertions:
          - result.code ShouldEqual 0
          - result.systemoutjson.AttributeName ShouldContain "Usage Limits"
      - name: Activate key with usage limits
        type: okms-cmd
        args: kmip activate {{.keyId}}
        assertions:
          - result.code ShouldEqual 0
      - name: Get usage allocation
        type: okms-cmd
        args: kmip get-usage-allocation {{.keyId}} --count 4
        assertions:
          - result.code ShouldEqual 0
          - result.systemoutjson.UniqueIdentifier ShouldEqual {{.keyId}}
      - name: Get remaining usage allocation
        type: okms-cmd
        args: kmip usage-allocation {{.keyId}} --count 6
        format: text
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual "Usage allocated for object {{.keyId}}"
      - name: Get usage allocation beyond the limits should fail
        type: okms-cmd
        args: kmip get-usage-allocation {{.keyId}} --count 1
        assertions:
          - result.code ShouldEqual 1
      - name: Get usage allocation of a key without usage limits should fail
        type: okms-cmd
        args: kmip get-usage-allocation {{.Create-keys.aesKeyId}} --count 1
        assertions:
          - result.code ShouldEqual 1
      - name: Revoke key with usage limits
        type: okms-cmd
        args: kmip revoke --force {{.keyId}}
        assertions:
          - result.code ShouldEqual 0

  - name: Revoke kmip object
    steps:
      - name: Revoke activated AES key
        type: okms-cmd
        args: kmip revoke --force {{.Create-keys.aesKeyId}}
        assertions:
          - result.code ShouldEqual 0
      - name: Revoke activated AES key againe should fail
        type: okms-cmd
        args: kmip revoke --force {{.Create-keys.aesKeyId}}
        assertions:
          - result.code ShouldEqual 1

  - name: Rekey kmip objects
    steps:
      - name: Rekey AES key
        type: okms-cmd
        args: kmip rekey {{.Create-keys.aesKeyId}}
        assertions:
          - result.code ShouldEqual 0
        vars:
          newAesKeyId:
            from: result.systemoutjson.UniqueIdentifier
      - name: Get replacement key attributes
        type: okms-cmd
        args: kmip attr get {{.newAesKeyId}}
        assertions:
          - result.code ShouldEqual 0

  - name: Destroy kmip object
    steps:
      - name: Destroy revoked object
        type: okms-cmd
        args: kmip destroy --force {{.Create-keys.aesKeyId}}
        assertions:
          - result.code ShouldEqual 0
      - name: Destroy a destroyed object should fail
        type: okms-cmd
        args: kmip destroy --force {{.Create-keys.aesKeyId}}
        assertions:
          - result.code ShouldEqual 1
      - name: Destroy PreActive object
        type: okms-cmd
        args: kmip destroy --force {{.Create-keys.pubRsaKeyId}}
        assertions:
          - result.code ShouldEqual 0
      - name: Locate without details
        type: okms-cmd
        args: kmip locate
        assertions:
          - result.code ShouldEqual 0
          - result.systemoutjson.UniqueIdentifier ShouldNotContain {{.Create-keys.aesKeyId}}
          - result.systemoutjson.UniqueIdentifier ShouldNotContain {{.Create-keys.pubRsaKeyId}}
          - result.systemoutjson.UniqueIdentifier ShouldContain {{.Create-keys.privRsaKeyId}}
          - result.systemoutjson.UniqueIdentifier ShouldContain {{.Create-keys.pubEcdsaKeyId}}
          - result.systemoutjson.UniqueIdentifier ShouldContain {{.Create-keys.privEcdsaKeyId}}

  - name: Cleanup Domain
    steps:
      # - name: List all active keys
      #   type: okms-cmd
      #   args: kmip ls --state active
      #   assertions:
      #     - result.code ShouldEqual 0
      #   vars:
      #     allKeys:
      #       from: result.systemoutjson.UniqueIdentifier

      # - name: Revoke key {{ .value }}
      #   type: okms-cmd
      #   skip:
      #     - allKeys ShouldBeNil
      #   range: "{{ .allKeys }}"
      #   args: kmip revoke {{ .value }} --force
      #   assertions:
      #     - result.code ShouldEqual 0

      - name: List all keys
        type: okms-cmd
        args: kmip ls
        assertions:
          - result.code ShouldEqual 0
        vars:
          allKeys:
            from: result.systemoutjson.UniqueIdentifier

      - name: Force delete {{ .value }}
        type: okms-cmd
        range: "{{.allKeys}}"
        args: kmip delete {{ .value }} --force
        assertions:
          - result.code ShouldEqual 0
